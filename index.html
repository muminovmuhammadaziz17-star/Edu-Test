
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EDU TEST | Online Ta'lim Platformasi</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                <span class="logo-icon">E</span>
                EDU TEST
            </div>

            <div class="welcome">
                <h1 id="welcomeTitle">Xush kelibsiz!</h1>
                <p id="welcomeText">
                    Bilimingizni sinab ko'rish vaqti keldi.
                </p>
            </div>

            <div class="tabs">
                <button id="loginTab" class="tab active">
                    Kirish
                </button>

                <button id="registerTab" class="tab">
                    Ro'yxatdan o'tish
                </button>
            </div>

            <form id="authForm">

                <div id="nameGroup" class="form-group hidden">
                    <label>Ism va familiya</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Ism Familiya"
                    >
                </div>

                <div class="form-group">
                    <label>Email manzil</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Parol</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Kamida 6 ta belgi"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" id="submitBtn" class="primary-btn">
                    Tizimga kirish
                </button>

                <p id="message" class="message"></p>

            </form>

            <div class="auth-footer">
                <p>© 2026 EDU TEST</p>
                <span>Online Education Platform</span>
            </div>

        </div>

    </div>

    <script type="module" src="js/auth.js"></script>

</body>
</html>
